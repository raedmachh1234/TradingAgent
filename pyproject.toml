[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantbot"
version = "0.1.0"
description = "Orchestrator for trading sub-bots with one execution gate (observe, human-confirm, auto-with-limits, full-auto)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",
    "duckdb>=1.0",
    "PyYAML>=6.0",
    "cryptography>=42",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
allocators = ["skfolio>=1.12"]
# only to re-run the library comparison; Riskfolio-Lib pulls in vectorbt (Apache 2.0 with Commons Clause)
bakeoff = ["PyPortfolioOpt>=1.6", "Riskfolio-Lib>=7.4"]

[project.scripts]
quantbot = "quantbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantbot = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
